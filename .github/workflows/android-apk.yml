# Gera o APK Android no GitHub (sem EAS e sem conta Expo).
# Corre sozinho a cada push para main, ou à mão em Actions › Android APK › Run workflow.
# O APK fica em Actions › (a execução) › Artifacts › bebida-apk.
#
# Variáveis (Settings › Secrets and variables › Actions › Variables):
#   EXPO_PUBLIC_FIREBASE_*            para entrar com email (opcional)
#   EXPO_PUBLIC_ADMOB_BANNER_HOME     IDs reais do AdMob (deixa vazios no APK
#   EXPO_PUBLIC_ADMOB_BANNER_HISTORY  de teste: assim mostra anúncios de teste)
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_ADMOB_BANNER_HOME: ${{ vars.EXPO_PUBLIC_ADMOB_BANNER_HOME }}
      EXPO_PUBLIC_ADMOB_BANNER_HISTORY: ${{ vars.EXPO_PUBLIC_ADMOB_BANNER_HISTORY }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto Android (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Nome do ficheiro
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mv android/app/build/outputs/apk/release/app-release.apk "bebida-${VERSION}-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: bebida-apk
          path: bebida-*.apk
          retention-days: 30
